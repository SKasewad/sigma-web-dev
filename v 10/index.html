<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and video</title>
</head>
<body>
    <div>
    <video src="funny.mp4" width="500" controls loop poster="Batman.jpeg"></video>
    </div>
    <div>
    <audio src="faaah.mp3" controls loop  ></audio>
    </div>
    <div>
    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="red" />
    </svg>
    </div>
    <div>       
    <iframe src="https://www.codewithharry.com/tutorial/html-input-types"></iframe>
    </div>
    <div>
       <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=jl49urJolpgDtTOQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</body>
</html>
