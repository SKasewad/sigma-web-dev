<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and outline</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
           box-shadow: inset 1px 1px 20px 11px red;
        }
        .text-shadow{
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            border: 3px solid green;
            outline: 2px dashed blue;
            outline-offset: 19px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
    I am a box.
    </div>
    <p class="text-shadow">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequuntur quia accusantium quaerat!
    </p>
</body>
</html>
