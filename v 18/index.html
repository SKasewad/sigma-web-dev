<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        *{
            margin : 0;
            padding : 0;
        }
        .box {
            background-color: lightblue;
        }
        .box1{
            color: yellow;
            padding: 10px;
            margin:25px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }
        /* Margin collapse is a phenomenon in CSS where the vertical margins of adjacent elements collapse into a single margin. This can lead to unexpected spacing issues in your layout. To prevent margin collapse, you can use the following techniques: */
        .box2{
            color: red;
            padding: 10px;
            margin:25px;
            border: 2px solid rgb(48, 35, 195);
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div class="box box1"> I am a box</div>
<div class="box box2"> I am another box</div>
</body>
</html>
