<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it</title>
</head>
<body>
    <h1>Form to apply sigma web dev course- TA
    </h1>
    <div>
    <form action="post">
        <label for="username">Enter your username:</label>
        <br
        <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <lable for="male">Male</lable>
             <input type="radio" id="female" name="gender" value="female">
            <lable for="female">Female</lable>
        </div>
        <div> 
            <input type="checkbox" id=" subscibe" name="subscribe" value="yes">
            <label for="subscibe">Subscribe to newsletter</label>
        </div>
        <div>
            <label for="message">Enter your comment</label>
            <br>
            <textarea id="message" name="message" placeholder="Enter your message here"></textarea>
            <br>
        </div>
        <div>
            <select name="City">
            <option value="Nanded">Nanded</option>
            <option value="Pune">Pune</option>
            <option value="Mumbai">Mumbai</option>
            </select>
        </div>
    </form>
</body>
</html>
