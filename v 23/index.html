<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Properties</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box1 {
            border: 2px solid blue;
            display: inline-block;
            padding: 45px;
            margin: 34px;
            background-color: lightcoral;
            /* display: none; */
        }
             .box2 {
            border: 2px solid blue;
            display: inline-block;
            padding: 45px;
            margin: 34px;
            background-color: lightcoral;
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="box1">
        I am a Box
    </div>
    <div class="box2">also a nice box</div>
    <span>I am a good</span>
    <span>Boy</span>
    <div class="box1">wrapped all the todays things
    </div>
</body>
</html>
